<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Personal Information</h1>
      <p class="subtitle">Fill in the form to register</p>

      <form action="" id="form" novalidate>
        <div class="field">
          <input type="text" id="name" name="name" placeholder=" " autocomplete="given-name" required />
          <label for="name">First Name</label>
          <p class="error" id="name-error"></p>
        </div>

        <div class="field">
          <input type="text" id="surname" name="surname" placeholder=" " autocomplete="family-name" required />
          <label for="surname">Surname</label>
          <p class="error" id="surname-error"></p>
        </div>

        <div class="field">
          <input type="email" id="email" name="email" placeholder=" " autocomplete="email" required />
          <label for="email">Gmail</label>
          <p class="error" id="email-error"></p>
        </div>

        <div class="field">
          <input type="password" id="password" name="password" placeholder=" " autocomplete="new-password" required />
          <label for="password">Password</label>

          <!-- Чекбокс «Show/Hide Password» оформлений як іконка ока -->
          <input type="checkbox" id="checkbox" name="checkbox" class="visually-hidden" />
          <label for="checkbox" class="eye" title="Show/Hide Password" aria-label="Show/Hide Password">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" />
              <circle cx="12" cy="12" r="3" />
              <line class="slash" x1="3" y1="3" x2="21" y2="21" />
            </svg>
          </label>
          <p class="error" id="password-error"></p>
        </div>

        <button type="submit" id="submit" disabled>Submit</button>
      </form>
    </main>

    <script src="validation.js"></script>
    <script src="validationPage.js"></script>
    <script src="index.js"></script>
  </body>
</html>
